<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign up — SpeakAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<nav>
  <a class="logo" href="index.html">Speak<span>AI</span></a>
  <div class="nav-right">
    <button class="btn btn-ghost" onclick="window.location.href='index.html'">← Back to home</button>
    <button class="btn btn-ghost" onclick="window.location.href='login.html'">Log in</button>
  </div>
</nav>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Speak<span>AI</span></div>
    <div class="auth-title">Start speaking today</div>
    <div class="auth-sub">7-day free trial · No credit card required</div>
    <div class="form-group">
      <label class="form-label">Full name</label>
      <input class="form-input" id="authName" type="text" placeholder="Your full name" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input class="form-input" id="authEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
      <div class="form-error" id="authEmailError"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="authPassword" type="password" placeholder="Create a password (min 6 characters)" autocomplete="new-password"/>
      <div class="form-error" id="authPassError"></div>
    </div>
    <div class="form-success" id="authSuccess"></div>
    <div class="loading-spinner" id="loadingSpinner">Creating your account...</div>
    <button class="form-btn" onclick="handleSignup()">Create free account →</button>
    <div class="auth-divider"><div class="auth-divider-line"></div><div class="auth-divider-text">or</div><div class="auth-divider-line"></div></div>
    <button class="form-btn form-btn-secondary" onclick="window.location.href='dashboard.html'">Continue with Google</button>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
